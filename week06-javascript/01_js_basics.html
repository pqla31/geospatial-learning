<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 基础 | week06</title>
    <link rel="stylesheet" href="../week05-frontend/style.css">
</head>
<body>

<section>
    <h1 id="title">Hello JavaScript</h1>
    <p>点击下面的按钮，看 JavaScript 怎么让页面动起来。</p>
    <p>点击次数：<span id="count" style="font-size: 1.5em; font-weight: bold; color: #e74c3c;">0</span></p>
    <button id="btn" style="padding: 10px 24px; font-size: 1.1em; cursor: pointer;">点击我</button>
    <button id="reset" style="padding: 10px 24px; font-size: 1.1em; cursor: pointer; margin-left: 8px;">重置</button>
</section>

<!-- JavaScript 写在 <script> 标签里，通常放 body 最末尾 -->
<script>
    // ===== 1. 变量声明 =====
    // let = 可变变量（类似 Python 的普通变量）
    // const = 不可重新赋值（Python 没有直接对应，约定大写变量名）
    let count = 0;                                   // 计数器，会变
    const titleEl = document.querySelector('#title');  // 选到的元素不会再换
    const btn = document.querySelector('#btn');
    const countEl = document.querySelector('#count');

    // ===== 2. console.log = Python 的 print =====
    // 输出在浏览器的 F12 → Console 面板看（不是页面上）
    console.log('页面加载完成');
    console.log('title 元素:', titleEl);
    console.log('按钮元素:', btn);

    // ===== 3. 绑定点击事件 =====
    // addEventListener('事件类型', 函数)
    // 点击按钮时，自动运行里面的函数
    btn.addEventListener('click', function() {
        count = count + 2;                       // 自选：改成了 +2
        countEl.textContent = count;             // 改页面上的数字
        console.log('第', count, '次点击');

        // 根据次数改标题文字
        if (count === 6) {
            titleEl.textContent = '点了 6 次！';
            titleEl.style.color = '#e74c3c';
        } else if (count === 12) {
            titleEl.textContent = '十er次了！厉害';
            titleEl.style.color = '#2ecc71';
        } else if (count >= 20) {
            titleEl.textContent = '别点了，都 ' + count + ' 次了';
            titleEl.style.color = '#95a5a6';
        }
    });

    // 重置按钮：独立监听，不在上面的函数里
    const resetBtn = document.querySelector('#reset');
    resetBtn.addEventListener('click', function() {
        count = 0;
        countEl.textContent = 0;
        titleEl.textContent = 'Hello JavaScript';
        titleEl.style.color = '';
        console.log('已重置');
    });

    /* ===== 4. JS 和 Python 的语法对比（看注释就行）=====
       console.log()        →  print()
       let x = 1            →  x = 1
       const PI = 3.14      →  PI = 3.14（约定大写）
       === 严格相等          →  == （JS 多一层：=== 不转类型，== 会转，别用 ==）
       if (条件) { }        →  if 条件:
       function f(x) { }    →  def f(x):
       // 单行注释          →  #
       / * 多行注释 * /      →  """多行注释"""   （注释里别写 /* */，会提前关闭注释块）
    */

    // ===== 5. 自己动手 =====
    // 1. 加一个"重置"按钮，点击后 count 归 0、标题恢复"Hello JavaScript"
    // 2. 改成点一次按钮 count +2 而不是 +1
    // 3. 在 console 里敲 count 看当前值（F12 Console 直接输入变量名回车）
</script>

</body>
</html>
